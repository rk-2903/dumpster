<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="dumpster.css" />
    <title>Dumpster</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>Dumpster</h1>
      </div>
      <div class="header-actions">
        <button id="export-open" class="btn">Export</button>
      </div>
    </header>

    <nav id="tabs" class="tabs" aria-label="Buckets"></nav>

    <main class="content-area">
      <div class="bucket-toolbar">
        <div class="bucket-title">
          <h2 id="bucket-name">—</h2>
          <span id="entry-count" class="count"></span>
        </div>
        <div class="bucket-tools">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="search" class="search" type="search" placeholder="Filter this bucket…" />
          </div>
          <button id="rename-bucket" class="btn subtle">Rename</button>
          <button id="delete-bucket" class="btn subtle danger">Delete</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="entries" class="entries">
          <thead>
            <tr>
              <th class="col-time">When</th>
              <th class="col-content">Dumped</th>
              <th class="col-source">Source</th>
              <th class="col-status">Status</th>
              <th class="col-notes">Notes</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty" hidden>
          Nothing here yet. Right-click a page → <b>Dump to</b>, or use the toolbar popup.
        </div>
      </div>
    </main>

    <div id="export-modal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="export-title">
        <h3 id="export-title">Export</h3>

        <div class="modal-section">
          <span class="modal-label">Format</span>
          <div class="segmented" id="export-format">
            <button type="button" class="seg active" data-format="xlsx">Excel (.xlsx)</button>
            <button type="button" class="seg" data-format="json">JSON</button>
          </div>
          <p class="modal-hint" id="format-hint">One sheet per bucket.</p>
        </div>

        <div class="modal-section">
          <span class="modal-label">Buckets</span>
          <label class="check check-all">
            <input type="checkbox" id="export-all" /> <span>All buckets</span>
          </label>
          <div id="export-buckets" class="check-list"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="export-cancel" class="btn subtle">Cancel</button>
          <button type="button" id="export-go" class="btn primary">Export</button>
        </div>
      </div>
    </div>

    <script type="module" src="dumpster.js"></script>
  </body>
</html>

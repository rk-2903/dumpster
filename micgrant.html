<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Enable microphone</title>
    <style>
      body {
        width: auto;
        min-width: 0;
      }
      .status {
        margin: 10px 0 2px;
        padding: 12px 14px;
        background: var(--chip);
        border-radius: 10px;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .status.ok {
        color: var(--text);
      }
      .status b {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Enable microphone</span>
      </div>
    </header>
    <main class="panel">
      <div class="status" id="status">
        Chrome is asking for microphone access — click <b>Allow</b> in the prompt.
        This one-time grant lets you dictate notes in the IvyNotes panel; audio is
        only used while the mic button is on and is never recorded or stored.
      </div>
      <div class="actions">
        <button id="retry" class="primary-btn" hidden>Ask again</button>
      </div>
    </main>
    <script src="micgrant.js"></script>
  </body>
</html>

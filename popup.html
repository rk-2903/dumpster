<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>IvyNotes</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>IvyNotes</span>
      </div>
      <button id="open-viewer" class="link-btn" title="Open the full workspace">View all ↗</button>
    </header>

    <main class="panel">
      <label class="field-label" for="bucket">Bucket</label>
      <div class="kind-tabs" role="tablist" aria-label="Bucket type">
        <button class="kind-tab" data-kind="sheet" role="tab" type="button">Sheet</button>
        <button class="kind-tab" data-kind="doc" role="tab" type="button">Doc</button>
      </div>
      <div class="bucket-row">
        <select id="bucket" class="bucket-select"></select>
        <button id="new-bucket" class="ghost-btn" title="Create a new bucket">＋</button>
      </div>

      <label class="field-label" for="content">Dump</label>
      <textarea
        id="content"
        class="content"
        rows="3"
        placeholder="Paste a link, snippet, or note…"
        autofocus
      ></textarea>

      <div class="attach-row">
        <label class="attach">
          <input type="checkbox" id="attach-page" checked />
          <span id="attach-label" class="attach-label">Attach this page</span>
        </label>
        <button id="shot" class="shot-btn" title="Screenshot the visible page into this Doc bucket">📸 Screenshot</button>
      </div>

      <ul id="staged" class="staged" hidden></ul>

      <div class="actions">
        <button id="add-more" class="secondary-btn">Add another</button>
        <button id="submit" class="primary-btn">Dump</button>
      </div>
      <p class="hint">Tip: right-click any page, link, or selection → <b>Dump to</b>.</p>
      <label class="setting-toggle" title="On this tab: a floating dock (screenshot region/visible) + an H1/H2/list/¶ pill when you select text">
        <input type="checkbox" id="selection-helper" />
        <span>Page helper: dock + selection menu</span>
      </label>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>

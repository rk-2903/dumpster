<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Dumpster — Doc panel</title>
    <style>
      body {
        width: auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg);
      }

      /* ---- Fixed top toolbar ---- */
      .doc-toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
        padding: 10px 12px 9px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .doc-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .doc-row .bucket-select {
        flex: 1;
        min-width: 0;
        padding: 7px 10px;
      }
      .doc-row .ghost-btn {
        width: 32px;
        height: 32px;
        font-size: 15px;
      }
      .fmt-row {
        display: flex;
        align-items: center;
        gap: 3px;
        flex-wrap: nowrap;
      }
      .fmt-select {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 5px 8px;
        cursor: pointer;
      }
      .fmt-btn {
        border: none;
        background: none;
        color: var(--muted);
        width: 28px;
        height: 28px;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fmt-btn:hover {
        background: var(--surface2);
        color: var(--text);
      }
      .fmt-btn.i {
        font-style: italic;
        font-weight: 600;
      }
      .fmt-btn.fmt-ocr {
        width: auto;
        padding: 0 7px;
        font-size: 10.5px;
        letter-spacing: 0.04em;
        border: 1px dashed var(--border);
      }
      .fmt-btn.fmt-ocr:hover {
        border-color: var(--accent);
      }
      .fmt-sep {
        width: 1px;
        align-self: stretch;
        margin: 3px 3px;
        background: var(--border);
      }
      .mode-tabs {
        margin-left: auto;
        display: flex;
        background: var(--surface2);
        border-radius: 8px;
        padding: 2px;
        gap: 2px;
      }
      .mode-tab {
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .mode-tab[aria-selected="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.12);
      }

      /* ---- Editor / preview ---- */
      .doc-main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .editor {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: none;
        resize: none;
        padding: 14px 16px 60px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        outline: none;
      }
      .preview {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 18px 60px;
        font-size: 13.5px;
        line-height: 1.65;
        scrollbar-width: thin;
      }
      .preview:empty::before,
      .preview.is-empty::before {
        content: "Nothing here yet — write in the editor, or select text / take a screenshot on the page.";
        color: var(--faint);
        font-size: 12.5px;
      }
      .preview h1 {
        font-size: 19px;
        margin: 14px 0 6px;
        letter-spacing: -0.01em;
      }
      .preview h2 {
        font-size: 16px;
        margin: 12px 0 5px;
      }
      .preview h3 {
        font-size: 14px;
        margin: 10px 0 4px;
      }
      .preview p {
        margin: 7px 0;
      }
      .preview ul,
      .preview ol {
        margin: 7px 0;
        padding-left: 22px;
      }
      .preview li {
        margin: 3px 0;
      }
      .preview blockquote {
        margin: 8px 0;
        padding: 6px 12px;
        border-left: 3px solid var(--accent);
        background: var(--surface2);
        border-radius: 0 8px 8px 0;
        color: var(--muted);
      }
      .preview code {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 12px;
      }
      .preview pre {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        overflow-x: auto;
      }
      .preview pre code {
        border: none;
        background: none;
        padding: 0;
      }
      .preview img {
        max-width: 100%;
        border-radius: 9px;
        border: 1px solid var(--border);
        display: block;
        margin: 8px 0;
      }
      .preview hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 14px 0;
      }
      .preview a {
        color: var(--accent);
        text-decoration: none;
      }
      .preview a:hover {
        text-decoration: underline;
      }

      /* ---- Bottom capture bar ---- */
      .capture-bar {
        border-top: 1px solid var(--border);
        background: var(--surface2);
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .capture-bar .secondary-btn {
        flex: 1;
        padding: 7px 10px;
        font-size: 12px;
      }
      .save-state {
        font-size: 10.5px;
        color: var(--faint);
        white-space: nowrap;
      }
      .export-wrap {
        position: relative;
        flex: 1;
        display: flex;
      }
      .export-wrap .secondary-btn {
        flex: 1;
      }
      .export-menu {
        position: absolute;
        bottom: calc(100% + 6px);
        right: 0;
        min-width: 130px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 4px;
        display: flex;
        flex-direction: column;
        z-index: 15;
      }
      .export-menu[hidden] {
        display: none !important;
      }
      .export-menu button {
        border: none;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        text-align: left;
        padding: 8px 11px;
        border-radius: 7px;
        cursor: pointer;
      }
      .export-menu button:hover {
        background: var(--surface2);
      }
      /* Transcript capture: toolbar variant of the export popover, anchored
         below the button instead of above (the toolbar sits at the top). */
      .cap-ts-wrap {
        position: relative;
        display: flex;
      }
      .cap-ts-wrap .fmt-btn svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .export-menu.cap-ts-menu {
        bottom: auto;
        top: calc(100% + 6px);
        right: 0;
        white-space: nowrap;
      }

      /* ---- Voice input (dictation) ---- */
      .voice-wrap {
        position: relative;
        display: flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .voice-wrap .secondary-btn {
        flex: 0 0 auto;
      }
      .voice-btn {
        padding: 8px 14px;
      }
      .voice-btn svg {
        width: 16px;
        height: 16px;
        display: block;
      }
      .voice-btn.rec {
        background: #ef4444;
        border-color: #ef4444;
        color: #fff;
        animation: voicepulse 1.5s ease-in-out infinite;
      }
      @keyframes voicepulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
        50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      }
      .voice-lang {
        padding: 8px 7px;
        font-size: 10.5px;
        white-space: nowrap;
      }
      .export-menu.voice-menu {
        left: 0;
        right: auto;
        max-height: 250px;
        overflow-y: auto;
        white-space: nowrap;
      }
      .voice-menu button.sel {
        background: var(--surface2);
      }
      /* live interim words while dictating */
      .voice-live {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        max-width: 280px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        padding: 8px 11px;
        font-size: 12px;
        font-style: italic;
        color: var(--faint);
        z-index: 14;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .voice-live[hidden] {
        display: none !important;
      }

      /* ---- Cloud status chip ---- */
      .cloud-chip {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cloud-dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        background: transparent;
        border: 1.5px solid var(--faint); /* disconnected: hollow */
      }
      .cloud-dot[data-state="synced"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .cloud-dot[data-state="syncing"] {
        background: #f59e0b;
        border-color: #f59e0b;
      }
      .cloud-dot[data-state="error"] {
        background: var(--danger, #ef4444);
        border-color: var(--danger, #ef4444);
      }

      /* ---- Sheet mode: mini tracker ---- */
      .kind-switch {
        margin-left: 0;
        flex: none;
      }
      .sheet-main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }
      .sheet-main[hidden] {
        display: none !important;
      }
      .doc-main[hidden],
      .fmt-row[hidden],
      .capture-bar[hidden] {
        display: none !important;
      }
      .sheet-add {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sheet-add-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .sheet-add textarea,
      .sheet-add .sheet-key {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
      }
      .sheet-add textarea {
        flex: 1;
        resize: none;
      }
      .sheet-add .sheet-key {
        width: 100%;
        font-size: 12px;
        padding: 6px 10px;
      }
      .sheet-add textarea:focus,
      .sheet-add .sheet-key:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: var(--ring);
      }
      .sheet-add .primary-btn {
        flex: none;
        padding: 8px 14px;
      }
      .sheet-rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        scrollbar-width: thin;
      }
      .sheet-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .sheet-row .txt {
        flex: 1;
        min-width: 0;
        font-size: 12.5px;
        line-height: 1.45;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
      }
      .sheet-row .txt a {
        color: var(--accent);
        text-decoration: none;
      }
      .sheet-row .src {
        display: block;
        font-size: 10.5px;
        color: var(--faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* per-row delete — subtle ✕ that turns red on hover */
      .sheet-row .row-del {
        flex: none;
        border: none;
        background: none;
        color: var(--faint);
        width: 22px;
        height: 22px;
        border-radius: 6px;
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sheet-row .row-del:hover {
        background: color-mix(in srgb, #ef4444 12%, transparent);
        color: #ef4444;
      }
      /* optional key — accent-tinted chip before the data text */
      .sheet-row .key {
        display: inline-block;
        max-width: 45%;
        margin-right: 6px;
        padding: 1px 7px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        color: var(--accent);
        font-size: 10.5px;
        font-weight: 700;
        vertical-align: 1px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .status-pill {
        flex: none;
        appearance: none;
        font: inherit;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 3px 8px;
        cursor: pointer;
        color: var(--tone, var(--muted));
        background: color-mix(in srgb, var(--tone, var(--muted)) 14%, transparent);
      }
      .status-pill[data-tone="green"] {
        --tone: #059669;
      }
      .status-pill[data-tone="amber"] {
        --tone: #b45309;
      }
      .status-pill[data-tone="gray"] {
        --tone: var(--muted);
      }
      @media (prefers-color-scheme: dark) {
        .status-pill[data-tone="green"] {
          --tone: #34d399;
        }
        .status-pill[data-tone="amber"] {
          --tone: #fbbf24;
        }
      }
      .sheet-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 22px;
        line-height: 1.5;
      }

      /* ---- Export picker (choose trackers, like the workspace modal) ---- */
      .pick-backdrop {
        position: fixed;
        inset: 0;
        z-index: 25;
        background: rgba(10, 14, 20, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .pick-backdrop[hidden] {
        display: none !important;
      }
      .pick-modal {
        width: 100%;
        max-width: 300px;
        max-height: 70vh;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pick-modal h3 {
        margin: 0;
        font-size: 14px;
      }
      .pick-all,
      .pick-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        cursor: pointer;
        padding: 5px 6px;
        border-radius: 7px;
      }
      .pick-all:hover,
      .pick-item:hover {
        background: var(--surface2);
      }
      .pick-all {
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        padding-bottom: 9px;
        font-weight: 600;
      }
      .pick-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pick-item input,
      .pick-all input {
        accent-color: var(--accent);
      }
      .pick-item .current {
        margin-left: auto;
        font-size: 10px;
        font-weight: 700;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        border-radius: 99px;
        padding: 1px 7px;
      }
      .pick-actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }
      .pick-actions .secondary-btn,
      .pick-actions .primary-btn {
        flex: 1;
        padding: 8px 10px;
        font-size: 12.5px;
      }

      /* ---- Drag-and-drop image target ---- */
      .drop-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: color-mix(in srgb, var(--bg) 72%, transparent);
        backdrop-filter: blur(1.5px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        pointer-events: none; /* drops fall through to the document handlers */
      }
      .drop-overlay[hidden] {
        display: none !important;
      }
      .drop-box {
        width: 100%;
        max-width: 280px;
        border: 2px dashed var(--accent);
        border-radius: 14px;
        background: color-mix(in srgb, var(--accent) 8%, var(--bg));
        padding: 26px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      .drop-icon {
        font-size: 22px;
      }
      #drop-label {
        font-size: 13px;
        font-weight: 700;
      }
      .drop-sub {
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="doc-toolbar">
      <div class="doc-row">
        <div class="mode-tabs kind-switch" role="tablist" aria-label="Bucket type">
          <button id="kind-doc" class="mode-tab" role="tab">Doc</button>
          <button id="kind-sheet" class="mode-tab" role="tab">Sheet</button>
        </div>
        <select id="bucket" class="bucket-select" title="Active doc"></select>
        <select id="sheet-bucket" class="bucket-select" title="Active tracker" hidden></select>
        <button id="new-bucket" class="ghost-btn" title="New bucket">＋</button>
        <button id="cloud-open" class="ghost-btn cloud-chip" title="Cloud sync">
          <span id="cloud-dot" class="cloud-dot"></span>
        </button>
        <button id="open-viewer" class="ghost-btn" title="Open full dumpster">↗</button>
      </div>
      <div class="fmt-row" id="fmt-row">
        <select id="fmt-block" class="fmt-select" title="Paragraph style">
          <option value="p">Normal</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
        </select>
        <button id="fmt-bold" class="fmt-btn" title="Bold (**text**)">B</button>
        <button id="fmt-italic" class="fmt-btn i" title="Italic (*text*)">I</button>
        <button id="fmt-code" class="fmt-btn" title="Code (`text`)">‹›</button>
        <span class="fmt-sep"></span>
        <button id="fmt-ul" class="fmt-btn" title="Bullet list">≔</button>
        <button id="fmt-ol" class="fmt-btn" title="Numbered list">1.</button>
        <span class="fmt-sep"></span>
        <button id="cap-region" class="fmt-btn" title="Screenshot a region of the page → end of doc">⬚</button>
        <button id="cap-ocr" class="fmt-btn fmt-ocr" title="Grab text from a region (OCR) → end of doc">OCR</button>
        <div class="cap-ts-wrap">
          <button id="cap-ts" class="fmt-btn" title="Capture the YouTube transcript (last 30s / 60s / full) → end of doc">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="5" width="19" height="14" rx="3"/>
              <path d="M6.5 11h4.5M14 11h3.5M6.5 14.5h7.5"/>
            </svg>
          </button>
          <div id="cap-ts-menu" class="export-menu cap-ts-menu" hidden>
            <button data-tsec="30">Last 30 seconds</button>
            <button data-tsec="60">Last 60 seconds</button>
            <button data-tsec="0">Full transcript</button>
          </div>
        </div>
        <div class="mode-tabs" role="tablist">
          <button id="mode-write" class="mode-tab" role="tab">Write</button>
          <button id="mode-preview" class="mode-tab" role="tab">Preview</button>
        </div>
      </div>
    </div>

    <main class="doc-main" id="doc-main">
      <textarea
        id="editor"
        class="editor"
        placeholder="Write in markdown… selections and screenshots from the page land here too."
        spellcheck="false"
        hidden
      ></textarea>
      <div id="preview" class="preview"></div>
    </main>

    <section class="sheet-main" id="sheet-main" hidden>
      <div class="sheet-add">
        <input id="sheet-key" class="sheet-key" type="text"
          placeholder="Key (optional) — e.g. username, id"
          title="Optional key — lands in its own column next to the data" />
        <div class="sheet-add-row">
          <textarea id="sheet-input" rows="2" placeholder="Data — add to this tracker… (⌘/Ctrl+Enter)"></textarea>
          <button id="sheet-add" class="primary-btn">Add</button>
        </div>
      </div>
      <div id="sheet-rows" class="sheet-rows"></div>
      <div id="sheet-empty" class="sheet-empty" hidden>
        Nothing tracked yet — add an item above, or right-click on any page →
        <b>Dump to</b>.
      </div>
    </section>

    <div class="capture-bar" id="doc-bar">
      <div class="voice-wrap">
        <button id="voice-btn" class="secondary-btn voice-btn"
          title="Dictate into the doc — speaks land at your cursor (or at the end if the editor isn't focused). Click again to stop.">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2.5" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/>
          </svg>
        </button>
        <button id="voice-lang" class="secondary-btn voice-lang" title="Dictation language">EN ▾</button>
        <div id="voice-menu" class="export-menu voice-menu" hidden></div>
        <div id="voice-live" class="voice-live" hidden></div>
      </div>
      <button id="share-doc" class="secondary-btn" title="Copy the doc's Google Docs link">⇪ Share</button>
      <button id="open-doc" class="secondary-btn" title="Open this doc">↗ Open Doc</button>
      <div class="export-wrap">
        <button id="export-doc" class="secondary-btn" title="Export this doc">⇓ Export</button>
        <div id="export-menu" class="export-menu" hidden>
          <button id="export-pdf">PDF</button>
          <button id="export-docx">Word (.docx)</button>
          <button id="export-md">Markdown</button>
        </div>
      </div>
      <span id="save-state" class="save-state">Saved</span>
    </div>

    <div class="capture-bar" id="sheet-bar" hidden>
      <button id="share-sheet" class="secondary-btn" title="Copy the tracker's Google Sheet link">⇪ Share</button>
      <button id="open-sheet" class="secondary-btn" title="Open this tracker's sheet">↗ Open Sheet</button>
      <div class="export-wrap">
        <button id="export-sheet" class="secondary-btn" title="Export this tracker">⇓ Export</button>
        <div id="sheet-export-menu" class="export-menu" hidden>
          <button id="export-xlsx">Excel (.xlsx)</button>
          <button id="export-json">JSON</button>
        </div>
      </div>
    </div>

    <div id="pick-backdrop" class="pick-backdrop" hidden>
      <div class="pick-modal" role="dialog" aria-modal="true" aria-labelledby="pick-title">
        <h3 id="pick-title">Export trackers</h3>
        <label class="pick-all">
          <input type="checkbox" id="pick-all" />
          <span>All trackers</span>
        </label>
        <div id="pick-list" class="pick-list"></div>
        <div class="pick-actions">
          <button id="pick-cancel" class="secondary-btn">Cancel</button>
          <button id="pick-go" class="primary-btn">Export</button>
        </div>
      </div>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden>
      <div class="drop-box">
        <span class="drop-icon">🖼</span>
        <span id="drop-label">Drop image to add to this doc</span>
        <span class="drop-sub">added at the end</span>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>

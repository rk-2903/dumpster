<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Dumpster — Study panel</title>
    <style>
      body {
        width: auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .shot-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .shot-row button {
        flex: 1;
      }
      .session {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        scrollbar-width: thin;
      }
      .session-item {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--chip);
        border-radius: 7px;
        padding: 6px 8px;
        font-size: 12px;
      }
      .session-item img {
        width: 42px;
        height: 28px;
        object-fit: cover;
        border-radius: 4px;
        border: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .session-item .txt {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .session-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        margin-top: 18px;
      }
      .hint-small {
        font-size: 11px;
        color: var(--muted);
        margin: 8px 0 0;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Study panel</span>
      </div>
      <button id="open-viewer" class="link-btn" title="Open full dumpster">View all ↗</button>
    </header>
    <main class="panel">
      <label class="field-label" for="bucket">Doc bucket</label>
      <div class="bucket-row">
        <select id="bucket" class="bucket-select"></select>
        <button id="new-bucket" class="ghost-btn" title="New Doc bucket">＋</button>
      </div>

      <label class="field-label" for="note">Note</label>
      <textarea id="note" class="content" rows="4" placeholder="Type a study note… (⌘/Ctrl+Enter to add)"></textarea>
      <div class="actions">
        <button id="add-note" class="primary-btn">Add note</button>
      </div>

      <div class="shot-row">
        <button id="shot-visible" class="secondary-btn">📸 Visible</button>
        <button id="shot-region" class="secondary-btn">⬚ Region</button>
      </div>
      <p class="hint-small">Tip: <b>Alt+Shift+S</b> screenshots to this bucket from any page.</p>

      <div id="session" class="session">
        <div class="session-empty" id="session-empty">Notes and screenshots you add<br />this session appear here.</div>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>

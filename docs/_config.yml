# has a public URL (the Chrome Web Store listing requires one).
# Source: repo Settings → Pages → branch `main`, folder `/docs`.
title: IvyNotes
description: Keep what you're learning — capture from any page, dictate, and study with AI, right in your sidebar.
theme: jekyll-theme-minimal
# Working notes, not public pages.
exclude:
  - IDEAS-LUNANOTES-GAPS.md
  - PUBLISHING.md
